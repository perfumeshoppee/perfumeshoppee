function priceHtml(o){return o?`<span class="price">${money(o.price)}</span>${o.old>o.price?`<span class="old">${money(o.old)}</span><span class="discount">-${pct(o)}%</span>`:''}`:''}
function sectionHtml(key,items){if(!items.length)return '';const visible=expanded[key]?items:items.slice(0,4);return `<section class="section"><div class="section-head"><h2 class="serif">${tr(key)}</h2>${items.length>4?`<button class="more" data-expand="${key}">${tr(expanded[key]?'less':'show')} (${items.length})</button>`:''}</div><div class="grid">${visible.map(cardHtml).join('')}</div></section>`}
function render(){const q=search.trim().toLocaleLowerCase();$('filters').hidden=filter!=='all';$('reviews').hidden=filter!=='home'||!!q;const normal=products.filter(p=>String(p.brand).toUpperCase()!=='BANNER');let html='';if(filter==='home'&&!q){const banner=products.find(p=>p.brand==='BANNER');if(banner?.photos[0])html+=`<img class="banner" src="${esc(banner.photos[0])}" alt="Perfume Shoppee">`;html+=sectionHtml('sets',normal.filter(isSet).sort((a,b)=>b._index-a._index));html+=sectionHtml('hits',normal.filter(p=>yes(p.isBest)&&!isSet(p)));html+=sectionHtml('news',normal.filter(p=>yes(p.isNew)&&!isSet(p)));html+=sectionHtml('catalog',normal)}else{const list=normal.filter(p=>{const text=[p.brand,p.namePL,p.nameUK,p.descPL,p.descUK].join(' ').toLocaleLowerCase();if(!text.includes(q))return false;if(filter==='sets'&&!isSet(p))return false;if(filter==='hit'&&!yes(p.isBest))return false;if(filter==='new'&&!yes(p.isNew))return false;if(filter==='sale'&&!isSale(p))return false;if(filter==='all'&&category!=='all'&&!(category==='sets'?isSet(p):p.category===category))return false;return true});html=`<section class="section"><div class="section-head"><h2 class="serif">${q?tr('catalog'):tr(({all:'catalog',sets:'sets',hit:'hits',new:'news',sale:'sale'})[filter])}</h2></div>${list.length?`<div class="grid">${list.map(cardHtml).join('')}</div>`:`<p class="empty">${tr('noProducts')}</p>`}</section>`}$('catalog').className='';$('catalog').innerHTML=html||`<p class="empty">${tr('noProducts')}</p>`;renderFilters()}
function renderFilters(){const opts=['all','female','male','uniseks','sets'];$('filters').innerHTML=opts.map(c=>`<button class="filter ${category===c?'active':''}" data-cat="${c}">${tr(c)}</button>`).join('')}
function navigate(f){filter=f;category='all';search='';$('search').value='';closePanels();render();window.scrollTo({top:0,behavior:'smooth'})}
function updateLanguage(){document.documentElement.lang=lang==='UA'?'uk':'pl';$('announcement').textContent=tr('announcement');$('search').placeholder=tr('search');$('sideLinks').innerHTML=[['home','home'],['all','catalog'],['sets','sets'],['hit','hits'],['new','news'],['sale','sale']].map(([f,t])=>`<button data-nav="${f}">${tr(t)}</button>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('cartTitle').textContent=tr('cart');$('totalLabel').textContent=tr('total');$('orderTelegram').textContent=tr('telegram');$('orderInstagram').textContent=tr('instagram');$('reviewsTitle').textContent=tr('reviews');$('reviewFormTitle').textContent=tr('reviewForm');$('reviewName').placeholder=tr('name');$('reviewText').placeholder=tr('text');$('photoLabel').textContent=tr('photos');$('submitReview').textContent=tr('publish');render();renderCart();renderReviews()}
function closePanels(){$('sidebar').classList.remove('open');$('cartDrawer').classList.remove('open');$('veil').classList.remove('show');document.body.style.overflow=''}function openPanel(id){closePanels();$(id).classList.add('open');$('veil').classList.add('show');document.body.style.overflow='hidden'}
function modalOpen(id,sizeIndex=0){selected=products[id];if(!selected)return;selectedSize=selected.options[sizeIndex]?.size||'';galleryIndex=0;renderModal();$('productModal').classList.add('open');document.body.style.overflow='hidden'}function modalClose(){$('productModal').classList.remove('open');document.body.style.overflow=''}
function renderModal(){const p=selected;if(!p)return;const photos=p.photos,photo=photos[galleryIndex]||'',o=p.options.find(x=>x.size===selectedSize);$('modalContent').innerHTML=`${photo?`<img class="modal-image" src="${esc(photo)}" alt="${esc(nameOf(p))}">`:''}${photos.length>1?`<div class="gallery-controls"><button data-gallery="prev">‹</button><span>${galleryIndex+1} / ${photos.length}</span><button data-gallery="next">›</button></div>`:''}<div class="brand">${esc(p.brand)}</div><h2 class="serif">${esc(nameOf(p))}</h2><p>${esc((descOf(p)||'').split('|')[galleryIndex]||(descOf(p)||'').split('|')[0]||'')}</p><h4>${tr('pick')}</h4>${p.options.map(x=>`<button class="modal-size ${x.size===selectedSize?'active':''}" data-modal-size="${esc(x.size)}"><span>${esc(x.size)}</span><strong>${money(x.price)} ${pct(x)?`<span class="discount">-${pct(x)}%</span>`:''} ${x.old>x.price?`<s class="old">${money(x.old)}</s>`:''}</strong></button>`).join('')}<button class="primary" id="modalAdd" ${!inStock(p)||!o?'disabled':''}>${inStock(p)?`♙ ${tr('add')} ${o?money(o.price):''}`:tr('out')}</button>`}
function addCart(p,o){if(!o||!inStock(p))return;cart.push({brand:p.brand,name:nameOf(p),size:o.size,price:o.price,img:p.photos[0]||'',id:Date.now()+Math.random()});localStorage.setItem('ps_cart',JSON.stringify(cart));renderCart();modalClose();openPanel('cartDrawer')}
function renderCart(){const c=$('cartItems');$('cartCount').textContent=cart.length;$('cartCount').hidden=!cart.length;c.innerHTML=cart.length?cart.map((item,i)=>`<div class="cart-item">${item.img?`<img src="${esc(item.img)}" alt="">`:''}<div class="details"><strong>${esc(item.brand)} ${esc(item.name)}</strong>${esc(item.size)} · ${money(num(item.price))}</div><button class="icon-btn" data-remove="${i}" aria-label="${tr('remove')}">×</button></div>`).join(''):`<p class="empty">${tr('empty')}</p>`;$('cartTotal').textContent=money(cart.reduce((s,x)=>s+num(x.price),0))}
function orderText(){return `${tr('order')}!\n\n`+cart.map((x,i)=>`${i+1}. ${x.brand} ${x.name} (${x.size}) — ${money(num(x.price))}`).join('\n')+`\n\n${tr('total')}: ${money(cart.reduce((s,x)=>s+num(x.price),0))}`}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch{const e=document.createElement('textarea');e.value=s;document.body.append(e);e.select();document.execCommand('copy');e.remove()}}
function renderStars(){$('ratingStars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" class="${n<=reviewRating?'active':''}">★</button>`).join('')}
function renderReviews(){renderStars();$('reviewAvg').textContent=reviews.length?`${(reviews.reduce((s,r)=>s+num(r.rating),0)/reviews.length).toFixed(1)} / 5 (${reviews.length})`:`0 / 5 (0)`;$('reviewsList').innerHTML=reviews.length?reviews.map(r=>{const photos=Array.isArray(r.photos)?r.photos:[];const date=r.createdAt?.toDate?.();return `<article class="review"><strong>${esc(r.name)}</strong> <span style="color:var(--gold)">${'★'.repeat(Math.max(0,Math.min(5,Number(r.rating)||0)))}</span><div class="notice">${date?date.toLocaleDateString(lang==='PL'?'pl-PL':'uk-UA'):''}</div><p>${esc(r.text)}</p>${photos.filter(x=>typeof x==='string'&&x.startsWith('data:image/')).map((x,i)=>`<img data-review-photo="${esc(r.id)}:${i}" src="${x}" alt="Review photo">`).join('')}${reviewUser&&r.ownerUid===reviewUser.uid?`<button class="more" data-delete-review="${esc(r.id)}">${tr('remove')}</button>`:''}</article>`}).join(''):`<p class="empty">${tr('noReviews')}</p>`}
function compressPhoto(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=reject;fr.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const cv=document.createElement('canvas');let max=600,quality=.65,out='';for(let j=0;j<6;j++){const scale=Math.min(1,max/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',quality);if(out.length<110000)break;max=Math.round(max*.8);quality=Math.max(.35,quality-.07)}resolve(out)};im.src=fr.result};fr.readAsDataURL(file)})}
async function initReviews(){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);reviewUser=(await firebase.auth().signInAnonymously()).user;firebase.firestore().collection('reviews').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{reviews=s.docs.map(d=>({id:d.id,...d.data()}));renderReviews()},e=>{$('reviewNotice').textContent=tr('login');console.error(e)})}catch(e){$('reviewNotice').textContent=tr('login');console.error(e)}}
$('menuBtn').onclick=()=>openPanel('sidebar');$('cartBtn').onclick=()=>openPanel('cartDrawer');$('closeSide').onclick=closePanels;$('closeCart').onclick=closePanels;$('veil').onclick=closePanels;$('homeLogo').onclick=()=>navigate('home');$('homeLogo').onkeydown=e=>{if(e.key==='Enter')navigate('home')};$('closeModal').onclick=modalClose;$('productModal').onclick=e=>{if(e.target===$('productModal'))modalClose()};$('search').oninput=e=>{search=e.target.value;render()};$('sideLinks').onclick=e=>{const b=e.target.closest('[data-nav]');if(b)navigate(b.dataset.nav)};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('ps_lang',lang);updateLanguage()});$('filters').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}};
$('catalog').onclick=e=>{const expand=e.target.closest('[data-expand]');if(expand){const k=expand.dataset.expand;expanded[k]=!expanded[k];render();return}const size=e.target.closest('[data-card-size]');if(size){const [id,i]=size.dataset.cardSize.split(':').map(Number);const card=size.closest('.product');card.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));size.classList.add('active');card.querySelector('[data-price]').innerHTML=priceHtml(products[id].options[i]);card.dataset.sizeIndex=i;return}const add=e.target.closest('[data-card-add]');if(add){const id=Number(add.dataset.cardAdd),p=products[id],card=add.closest('.product');addCart(p,p.options[Number(card.dataset.sizeIndex||0)]);return}const open=e.target.closest('[data-open]');if(open){const card=open.closest('.product');modalOpen(Number(open.dataset.open),Number(card?.dataset.sizeIndex||0))}};
$('modalContent').onclick=e=>{const size=e.target.closest('[data-modal-size]');if(size){selectedSize=size.dataset.modalSize;renderModal();return}const gal=e.target.closest('[data-gallery]');if(gal){galleryIndex=(galleryIndex+(gal.dataset.gallery==='next'?1:-1)+selected.photos.length)%selected.photos.length;renderModal();return}if(e.target.closest('#modalAdd'))addCart(selected,selected.options.find(o=>o.size===selectedSize))};$('cartItems').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){cart.splice(Number(b.dataset.remove),1);localStorage.setItem('ps_cart',JSON.stringify(cart));renderCart()}};
$('orderTelegram').onclick=async()=>{if(!cart.length)return;const t=orderText();await copyText(t);window.open('https://t.me/itselenelen','_blank','noopener');alert(lang==='PL'?'Skopiowano zamówienie. Wklej je w Telegramie.':'Замовлення скопійовано. Встав його в Telegram.')};$('orderInstagram').onclick=async()=>{if(!cart.length)return;await copyText(orderText());alert(tr('copied'));window.open('https://ig.me/m/perfume.shoppee','_blank','noopener')};
$('ratingStars').onclick=e=>{const b=e.target.closest('[data-rating]');if(b){reviewRating=Number(b.dataset.rating);renderStars()}};$('reviewForm').onsubmit=async e=>{e.preventDefault();if(!reviewUser){$('reviewNotice').textContent=tr('login');return}const btn=$('submitReview');btn.disabled=true;try{const files=[...$('reviewPhotos').files].filter(f=>f.type.startsWith('image/')).slice(0,3);const photos=[];for(const f of files)photos.push(await compressPhoto(f));await firebase.firestore().collection('reviews').add({name:$('reviewName').value.trim().slice(0,80),text:$('reviewText').value.trim().slice(0,2000),rating:reviewRating,photos,ownerUid:reviewUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('reviewForm').reset();reviewRating=5;renderStars();$('reviewNotice').textContent=tr('ok')}catch(err){console.error(err);$('reviewNotice').textContent=tr('fail')}finally{btn.disabled=false}};
$('reviewsList').onclick=async e=>{const del=e.target.closest('[data-delete-review]');if(del){const r=reviews.find(x=>x.id===del.dataset.deleteReview);if(r&&reviewUser&&r.ownerUid===reviewUser.uid)try{await firebase.firestore().collection('reviews').doc(r.id).delete()}catch(e){console.error(e)}return}const photo=e.target.closest('[data-review-photo]');if(photo){const [id,index]=photo.dataset.reviewPhoto.split(':');const r=reviews.find(x=>x.id===id);const src=r?.photos?.[Number(index)];if(src){$('zoomImg').src=src;$('photoZoom').classList.add('open')}}};$('photoZoom').onclick=()=>$('photoZoom').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){modalClose();closePanels();$('photoZoom').classList.remove('open')}});
updateLanguage();loadProducts();initReviews();
</script></body></html>
