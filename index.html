function applyProductsCSV(text) {
    allProducts = parseCSV(text).map((product, sheetIndex) => ({
            ...product,
            _sheetIndex: sheetIndex
    }));
    allProducts.sort((a, b) => {
        if (a.brand === "BANNER") return -1;
        if (b.brand === "BANNER") return 1;
        return (a.brand.localeCompare(b.brand)) || ((currentLang === 'UA' ? (a.nameUK || a.name) : (a.namePL || a.name)).localeCompare(currentLang === 'UA' ? (b.nameUK || b.name) : (b.namePL || b.name)));
    });
    updateUI();
    updateCatButtons();
    refreshCatalog();
    renderCart();
    loadGoogleReviews();
}

function getEmbeddedProductsCSV() {
    const binary = atob(EMBEDDED_PRODUCTS_CSV_BASE64);
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
}

        const res = await fetch(SPREADSHEET_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const freshText = await res.text();
        if (freshText.trim()) applyProductsCSV(freshText);
    } catch (e) {
        console.warn("Google Sheet unavailable; embedded catalog is used", e);
    }
}

async function initFirebaseReviews() {
    try {
        const credential = await firebaseAuth.signInAnonymously();
        currentReviewUser = credential.user;

        if (stopReviewsListener) stopReviewsListener();
        stopReviewsListener = firestoreDb.collection('reviews')
            .orderBy('createdAt', 'desc')
            .onSnapshot(snapshot => {
                firebaseReviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                loadGoogleReviews();
            }, error => {
                console.error('Reviews listener error:', error);
                showReviewsError();

async function handleFileSelect(input) {
    const files = Array.from(input.files).filter(file => file.type.startsWith('image/')).slice(0, 5);
    if (!files.length) return;

    const btnText = document.getElementById('uploadBtnText');
    btnText.innerText = "...";

        for (const file of files) {
            uploadedPhotoUrls.push(await compressReviewImage(file));
        }
        btnText.innerText = currentLang === 'PL'
            ? `✓ ${uploadedPhotoUrls.length} zdjęć`
            : `✓ ${uploadedPhotoUrls.length} фото`;
    } catch (error) {
        console.error('Image compression error:', error);
        uploadedPhotoUrls = [];
        btnText.innerText = i18n[currentLang].rev_choose_file;
        input.value = "";
    }
}

function compressReviewImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let maxSide = 700;
                let quality = 0.68;
                let result = '';

                for (let attempt = 0; attempt < 6; attempt++) {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    result = canvas.toDataURL('image/jpeg', quality);
                    if (result.length <= 140000) break;
                    maxSide = Math.round(maxSide * 0.85);
                    quality = Math.max(0.42, quality - 0.07);
                }
                resolve(result);
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

async function handleReviewSubmit(e) {

    const nameVal = document.getElementById('revName').value.trim();
    const textVal = document.getElementById('revText').value.trim();
    const btn = document.getElementById('submitReviewBtn');

    }

    btn.style.opacity = "0.6";
    btnText.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> ' + i18n[currentLang].pub_loading;

    try {
        await firestoreDb.collection('reviews').add({
            name: nameVal,
            text: textVal,
            rating: userRating,
            photos: uploadedPhotoUrls,
            ownerUid: currentReviewUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('revName').value = '';
        document.getElementById('revText').value = '';
        document.getElementById('revPhotoFile').value = '';
        document.getElementById('uploadBtnText').innerText = i18n[currentLang].rev_choose_file;

        console.error('Review publish error:', error);
        alert('Не вдалося опублікувати відгук. Перевірте налаштування Firebase.');
    } finally {
        btn.disabled = false;
        btn.style.opacity = "1";
        btnText.innerText = i18n[currentLang].pub_review;
    }
}

        document.getElementById('preview-rating').innerText = "5.0 / 5 (0)";
        renderReviewsPreview([]);
        return;
    }

    let clientHTML = clientReviews.map(r => {
        totalStars += parseInt(r.rating);
        count++;
        const safeName = escapeReviewHtml(r.name || '');
        const safeText = escapeReviewHtml(r.text || '');
        const date = r.createdAt && r.createdAt.toDate

        let photoHTML = '';
        if (reviewPhotos.length) {
            photoHTML = '<div class="flex gap-2 overflow-x-auto no-scrollbar mt-3">' + reviewPhotos
                .filter(photo => typeof photo === 'string' && photo.startsWith('data:image/'))
                .map(photo => '<div class="w-20 h-20 shrink-0 rounded-xl overflow-hidden bg-neutral-50 border border-neutral-100 shadow-sm cursor-pointer"><img src="' + photo + '" class="w-full h-full object-cover" onclick="openPhotoModal(\'' + photo + '\')"></div>')
                .join('') + '</div>';
        }

        const deleteButton = currentReviewUser && r.ownerUid === currentReviewUser.uid
            ? `<button onclick="deleteOwnReview('${r.id}')" class="absolute top-4 right-4 text-[9px] font-bold text-red-400 bg-red-50 px-2 py-1 rounded-md uppercase tracking-wider">${i18n[currentLang].delete_btn}</button>`
            : '';

        return `
            <div class="bg-white p-5 rounded-2xl border border-neutral-100 shadow-sm border-l-2 border-l-[#C5A059] relative">
                ${deleteButton}
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-xs">${safeName}</span>
                    <div class="text-[10px] flex gap-0.5">${stars}</div>
                </div>
                <div class="text-[9px] text-neutral-400 mb-2 font-medium">${date}</div>
                ${safeText ? `<p class="text-neutral-500 text-xs leading-relaxed">${safeText}</p>` : ''}
                ${photoHTML}
            </div>
        `;
    }).join('');

    listContainer.innerHTML = clientHTML;

    const finalAvg = count > 0 ? (totalStars / count).toFixed(1) : "5.0";
    document.getElementById('average-rating-num').innerText = `${finalAvg} / 5 (${count})`;
    document.getElementById('preview-rating').innerText = `${finalAvg} / 5 (${count})`;
    
    const starsContainer = document.getElementById('average-stars');
    let avgStarsHTML = '';
    const roundAvg = Math.round(parseFloat(finalAvg));
    for(let i=1; i<=5; i++) { 
        let isActive = i <= roundAvg ? 'text-[#C5A059]' : 'text-neutral-200';
        avgStarsHTML += '<i class="fa-solid fa-star ' + isActive + '"></i>';

function parseCSV(text) {
    let rows = [], row = [], col = '', q = false;
    for (let i = 0; i < text.length; i++) {
        let c = text[i], n = text[i+1];
        if (c === '"' && q && n === '"') { col += '"'; i++; }
        else if (c === '"') q = !q;
        else if (c === ',' && !q) { row.push(col.trim()); col = ''; }
        else if ((c === '\r' || c === '\n') && !q) {
            if (col || row.length) { row.push(col.trim()); rows.push(row); }
            row = []; col = ''; if (c === '\r' && n === '\n') i++;
        } else col += c;
    }
    if (col || row.length) { row.push(col.trim()); rows.push(row); }
    const h = rows[0];
    return rows.slice(1).map(r => {
        let o = {}; h.forEach((k, i) => o[k] = r[i] || "");
        return o;
    });
}

    let badgesHtml = '<div class="badges-wrapper">';
    const isNew = p.isNew?.toLowerCase() === 'yes' || p.isNew === true;
    const isHit = p.isBest?.toLowerCase() === 'yes' || p.isBest === true;
    const isSale = isSaleProduct(p);

    if (isNew) badgesHtml += `<span class="product-badge badge-new">✨ ${i18n[currentLang].badgeNew}</span>`;
    if (isHit) badgesHtml += `<span class="product-badge badge-hit">🔥 ${i18n[currentLang].badgeHit}</span>`;

        badgesHtml += `<span class="product-badge badge-out">🔒 ${i18n[currentLang].sold_badge}</span>`;

}

function switchCardSize(event, pIdx, sizeLabel, price, oldPrice) {
    event.stopPropagation();
    const container = document.getElementById(`price-block-${pIdx}`);
    if (!container) return;

    if (oldPrice && oldPrice !== '---' && oldPrice !== '') {
        container.innerHTML = `<span class="price-new">${price} zł</span><span class="price-old">${oldPrice} zł</span> <span class="text-[9px] text-neutral-400 font-normal">(${sizeLabel})</span>`;
    } else {
        container.innerHTML = `<span>${price} zł</span> <span class="text-[9px] text-neutral-400 font-normal">(${sizeLabel})</span>`;
    }

    const card = container.closest('.product-card');
    if (card) {
        card.querySelectorAll('.size-pill').forEach(btn => btn.classList.remove('active'));
        const activeBtn = event.currentTarget;
        if (activeBtn) activeBtn.classList.add('active');
        card.setAttribute('data-selected-size', sizeLabel);
    }
}

function renderList(list) {
    return list.map((p) => {
        const pIdx = allProducts.indexOf(p);
        const avail = isAvailable(p);
        const isSet = p.category?.toLowerCase().trim() === 'sets';
        const photo = p.photo.split(',')[0].trim();
        
        const sizes = [
            { label: '2ml', price: p.price2ml, old: p.old2ml },
            { label: '5ml', price: p.price5ml, old: p.old5ml },
            { label: '10ml', price: p.price10ml, old: p.old10ml },
            { label: 'Full', price: p.fullPrice, old: p.oldFull }
        ].filter(s => s.price && s.price !== '---' && s.price !== '');

        const initialSize = sizes[0] || { label: '', price: '0', old: '' };

        let selectorHtml = '';
        if (sizes.length > 1 && !isSet) {
            selectorHtml = `<div class="flex flex-wrap gap-1 mb-3">`;
            sizes.forEach((s, idx) => {
                const isActive = idx === 0 ? 'active' : '';
                selectorHtml += `
                    <button onclick="switchCardSize(event, ${pIdx}, '${s.label}', '${s.price}', '${s.old || ''}')" 
                            class="size-pill ${isActive}">
                        ${s.label}
                    </button>`;
            });
            selectorHtml += `</div>`;
        }

        let priceHtml = '';
        if (initialSize.old && initialSize.old !== '---' && initialSize.old !== '') {
            priceHtml = `<span class="price-new">${initialSize.price} zł</span><span class="price-old">${initialSize.old} zł</span>`;
        } else {
            priceHtml = `<span>${initialSize.price} zł</span>`;
        }
        if (!isSet && initialSize.label) {
            priceHtml += ` <span class="text-[9px] text-neutral-400 font-normal">(${initialSize.label})</span>`;
        }

        return `
        <div onclick="openModal(${pIdx})" id="prod-card-${pIdx}" data-selected-size="${initialSize.label}" class="product-card p-4 flex flex-col h-full ${!avail ? 'out-of-stock' : ''} ${isSet ? 'is-set-card' : ''}">

            <div class="mt-auto text-xs font-black text-[#062C22]" id="price-block-${pIdx}">
                ${priceHtml}
            </div>
        </div>`;
    }).join('');

    const slot = document.getElementById('modal-media-slot');
    const descEl = document.getElementById('m-desc');
    const brandWrapper = document.getElementById('m-brand-wrapper');
    
    const cardEl = document.getElementById(`prod-card-${idx}`);
    const preselectedSize = cardEl ? cardEl.getAttribute('data-selected-size') : '';

    btn.classList.add('opacity-20', 'cursor-not-allowed');
    btn.innerText = avail ? i18n[currentLang].add_to_cart : i18n[currentLang].sold_badge;

    let modalBadges = '';
    const isNew = p.isNew?.toLowerCase() === 'yes' || p.isNew === true;
    const isHit = p.isBest?.toLowerCase() === 'yes' || p.isBest === true;
    const isSale = isSaleProduct(p);

    if (!avail) {
        modalBadges += `<span class="bg-neutral-800 text-white text-[9px] font-extrabold px-2 py-1 rounded-md tracking-wider uppercase flex items-center gap-1">🔒 ${i18n[currentLang].sold_badge}</span>`;
    } else {
        if (isNew) modalBadges += `<span class="bg-amber-500/15 text-amber-600 text-[9px] font-extrabold px-2 py-1 rounded-md tracking-wider uppercase flex items-center gap-1">✨ ${i18n[currentLang].badgeNew}</span>`;
        if (isHit) modalBadges += `<span class="bg-emerald-600/15 text-emerald-700 text-[9px] font-extrabold px-2 py-1 rounded-md tracking-wider uppercase flex items-center gap-1">🔥 ${i18n[currentLang].badgeHit}</span>`;
        if (isSale) modalBadges += `<span class="bg-red-600/15 text-red-600 text-[9px] font-extrabold px-2 py-1 rounded-md tracking-wider uppercase flex items-center gap-1">% ${i18n[currentLang].badgeSale}</span>`;
    }

    brandWrapper.innerHTML = `
        <div class="text-[9px] font-black text-[#C5A059] uppercase tracking-[0.2em]">${p.brand}</div>
        <div class="flex items-center gap-1">${modalBadges}</div>
    `;

    const rawDesc = currentLang === 'UA' ? (p.descUK || i18n.UA.default_desc) : (p.descPL || i18n.PL.default_desc);
    const descParts = rawDesc.split('|').map(s => s.trim());
    descEl.innerText = descParts[0];

    if (isSet) {
        const photos = p.photo.split(',').map(s => s.trim());
        let sliderHTML = `<div class="swiper swiper-sets"><div class="swiper-wrapper">`;
        photos.forEach(url => { 
            sliderHTML += `<div class="swiper-slide"><img src="${url}" onerror="this.src='https://placehold.co/400x400?text=No+Photo'"></div>`; 
        });
        sliderHTML += `</div><div class="swiper-pagination"></div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div></div>`;
        slot.innerHTML = sliderHTML;
        
        setTimeout(() => { 
            swiperInstance = new Swiper(".swiper-sets", { 
                navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
                pagination: { el: ".swiper-pagination", clickable: true },
                on: { slideChange: function () {
                    if (descParts.length > 1) descEl.innerText = descParts[this.activeIndex] || descParts[0];
                }}
            }); 
        }, 50);
    } else {
        const photo = p.photo.split(',')[0].trim();
        slot.innerHTML = `<div class="pt-8 pb-4"><div class="img-container w-40 h-40 mx-auto bg-transparent"><img id="m-img" src="${photo}"></div></div>`;
        if(!avail) document.getElementById('m-img').style.opacity = '0.4';
    }

    document.getElementById('m-title').innerText = currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name);
    
    let html = '';
    const sizes = [{l:'2ml', p:p.price2ml, old:p.old2ml}, {l:'5ml', p:p.price5ml, old:p.old5ml}, {l:'10ml', p:p.price10ml, old:p.old10ml}, {l:'Full', p:p.fullPrice, old:p.oldFull}];
    
    sizes.forEach((o, index) => {
        if(o.p && o.p !== '---' && o.p !== '') {
            const hasDiscount = o.old && o.old !== '---' && o.old !== '';
            html += `<div id="m-size-row-${o.l}" onclick="${avail ? `selectSize(this, '${o.l}', '${o.p}', '${p.brand}', '${currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name)}', '${p.photo.split(',')[0].trim()}')` : ''}" 
                class="border border-neutral-100 flex justify-between items-center p-4 rounded-xl ${avail ? 'cursor-pointer hover:bg-neutral-50' : 'opacity-40 cursor-not-allowed'} text-xs font-bold transition-all">
                <span class="uppercase tracking-widest">${o.l}</span>
                <span class="text-[#062C22]">${hasDiscount ? `<span class="price-new">${o.p} zł</span><span class="price-old">${o.old} zł</span>` : `<span>${o.p} zł</span>`}</span>
            </div>`;
        }
    });
    
    document.getElementById('m-prices').innerHTML = html;
    document.getElementById('pModal').classList.remove('hidden');
    document.body.classList.add('lock-scroll');

    if (avail) {
        const targetLabel = preselectedSize || sizes.find(s => s.p && s.p !== '---' && s.p !== '')?.l;
        if (targetLabel) {
            const rowEl = document.getElementById(`m-size-row-${targetLabel}`);
            if (rowEl) rowEl.click();
        }
    }
}

function closeModal() { 
    document.getElementById('pModal').classList.add('hidden'); 
    document.body.classList.remove('lock-scroll');
    if(swiperInstance) { swiperInstance.destroy(true, true); swiperInstance = null; }
}

function selectSize(el, size, price, brand, name, img) {
    document.querySelectorAll('#m-prices div').forEach(d => { d.style.borderColor = '#F0F0F0'; d.style.background = 'white'; });
    el.style.borderColor = '#C5A059'; el.style.background = '#fdfaf3';
    selectedOption = { size, price, brand, name, img, id: Date.now() };
    const btn = document.getElementById('add-to-cart-btn');
    btn.classList.remove('opacity-20', 'cursor-not-allowed');
    btn.innerText = `${i18n[currentLang].add_to_cart} • ${price} zł`;
}

function addToCart() {
    if(!selectedOption) return;
    cart.push(selectedOption);
    localStorage.setItem('ps_cart', JSON.stringify(cart));
    renderCart(); closeModal(); toggleCart(true);
}

function parseCartPrice(value) {
    const price = Number(String(value ?? '').replace(',', '.').replace(/[^0-9.-]/g, ''));
    return Number.isFinite(price) ? price : 0;
}

function formatPrice(value) {
    return `${value.toFixed(2)} zł`;
}

function getCartTotals() {
    const subtotal = cart.reduce((sum, item) => sum + parseCartPrice(item.price), 0);
    const discount = Math.round((subtotal * STORE_DISCOUNT_PERCENT / 100) * 100) / 100;
    const total = Math.round((subtotal - discount) * 100) / 100;
    return { subtotal, discount, total };
}

function renderCart() {
    const c = document.getElementById('cart-items');
    const countEl = document.getElementById('cart-count');
    countEl.innerText = cart.length;
    countEl.classList.toggle('hidden', cart.length === 0);
    if (cart.length === 0) {
        c.innerHTML = `<div class="text-center py-10 text-neutral-300 text-[9px] uppercase font-bold">${i18n[currentLang].empty_cart}</div>`;
    } else {
        c.innerHTML = cart.map((item, i) => {
            return `<div class="flex gap-4 items-center">
                <div class="w-14 h-14 bg-neutral-50 rounded-xl p-2 flex items-center justify-center"><img src="${item.img}" class="max-w-full max-h-full object-contain"></div>
                <div class="flex-1 min-w-0">
                    <div class="text-[7px] font-black text-[#C5A059] uppercase">${item.brand}</div>
                    <div class="text-[10px] font-bold truncate">${item.name}</div>
                    <div class="text-[9px] text-neutral-400 font-bold">${item.size} • ${item.price} zł</div>
                </div>
                <button onclick="removeFromCart(${i})" class="text-neutral-200 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        }).join('');
    }

    const totals = getCartTotals();
    document.getElementById('cart-subtotal').innerText = formatPrice(totals.subtotal);
    document.getElementById('cart-discount').innerText = `−${formatPrice(totals.discount)}`;
    document.getElementById('cart-total').innerText = formatPrice(totals.total);
}

function removeFromCart(i) { cart.splice(i, 1); localStorage.setItem('ps_cart', JSON.stringify(cart)); renderCart(); }

function buildOrderText() {
    const totals = getCartTotals();
    let t = `${i18n[currentLang].order_msg}!\n\n`;
    cart.forEach((it, i) => t += `${i+1}. ${it.brand} ${it.name} (${it.size}) - ${it.price} zł\n`);
    t += `\n🧾 ${i18n[currentLang].cart_subtotal_label}: ${formatPrice(totals.subtotal)}`;
    t += `\n🏷️ ${i18n[currentLang].cart_discount_label}: −${formatPrice(totals.discount)}`;
    t += `\n💰 ${i18n[currentLang].cart_total_label}: ${formatPrice(totals.total)}`;
    return t;
}

function sendOrder() {
    if (cart.length === 0) return;
    const t = buildOrderText();
    window.open(`https://t.me/${TG_NICK}?text=${encodeURIComponent(t)}`, '_blank');
}

async function sendInstagramOrder() {
    if (cart.length === 0) return;
    const t = buildOrderText();

    try {
        await navigator.clipboard.writeText(t);
    } catch (error) {
        const textArea = document.createElement('textarea');
        textArea.value = t;
        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
    }

    alert(i18n[currentLang].instagram_copied);
    window.open(`https://ig.me/m/${INSTAGRAM_NICK}`, '_blank');
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); document.body.classList.toggle('lock-scroll'); }
function toggleCart(st) { const p = document.getElementById('cart-panel'); if (st === true) p.classList.remove('translate-x-full'); else p.classList.toggle('translate-x-full'); }

function saveState() {
    localStorage.setItem('ps_currentFilter', currentFilter);
    localStorage.setItem('ps_curCat', curCat);
}

function goHome() { currentFilter = 'home'; curCat = 'all'; saveState(); refreshCatalog(); }
function showAllCatalog() { currentFilter = 'all'; curCat = 'all'; saveState(); updateCatButtons(); refreshCatalog(); }
function setCategory(c) { curCat = c; saveState(); updateCatButtons(); refreshCatalog(); }
function updateCatButtons() { document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.id === 'cat-' + curCat)); }
function filterBy(type) { currentFilter = type; saveState(); window.scrollTo({top: 0, behavior: 'smooth'}); refreshCatalog(); }

document.getElementById('add-to-cart-btn').onclick = addToCart;
init();
</script>
</body>
</html>
