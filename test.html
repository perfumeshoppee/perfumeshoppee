        allProducts = parseCSV(text);
        allProducts.sort((a, b) => {
            if (a.brand === "BANNER") return -1;
            if (b.brand === "BANNER") return 1;
            return (a.brand.localeCompare(b.brand)) || ((currentLang === 'UA' ? (a.nameUK || a.name) : (a.namePL || a.name)).localeCompare(currentLang === 'UA' ? (b.nameUK || b.name) : (b.namePL || b.name)));
        });
        updateUI(); updateCatButtons(); refreshCatalog(); renderCart(); loadGoogleReviews();
        setTimeout(() => { AOS.init({ duration: 800, once: true, offset: 50 }); }, 200);
    } catch (e) { console.error("CSV Load Error", e); }
}

async function initFirebaseReviews() {
    try {
        const credential = await firebaseAuth.signInAnonymously();
        currentReviewUser = credential.user;

        if (stopReviewsListener) stopReviewsListener();
        stopReviewsListener = firestoreDb.collection('reviews')
            .orderBy('createdAt', 'desc')
            .onSnapshot(snapshot => {
                firebaseReviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                loadGoogleReviews();
            }, error => {
                console.error('Reviews listener error:', error);
                showReviewsError();
            });
    } catch (error) {
        console.error('Firebase authentication error:', error);
        showReviewsError();
    }
}

async function handleFileSelect(input) {
    const file = input.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) return;
    const btnText = document.getElementById('uploadBtnText');
    btnText.innerText = "...";

    try {
        uploadedPhotoUrl = await compressReviewImage(file);
        btnText.innerText = "✓ OK";
    } catch (error) {
        console.error('Image compression error:', error);
        uploadedPhotoUrl = "";
        btnText.innerText = i18n[currentLang].rev_choose_file;
        input.value = "";
    }
}

function compressReviewImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                const maxSide = 900;
                const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(img.width * scale));
                canvas.height = Math.max(1, Math.round(img.height * scale));
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.72));
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

async function handleReviewSubmit(e) {
    e.preventDefault();
    const nameVal = document.getElementById('revName').value.trim();
    const textVal = document.getElementById('revText').value.trim();
    const btn = document.getElementById('submitReviewBtn');
    const btnText = document.getElementById('btn-text-content');
    
    if(!nameVal || !textVal || !currentReviewUser) {
        if (!currentReviewUser) showReviewsError();
        return;
    }

    btn.disabled = true;
    btn.style.opacity = "0.6";
    btnText.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> ' + i18n[currentLang].pub_loading;

    try {
        await firestoreDb.collection('reviews').add({
            name: nameVal,
            text: textVal,
            rating: userRating,
            photo: uploadedPhotoUrl,
            ownerUid: currentReviewUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('revName').value = '';
        document.getElementById('revText').value = '';
        document.getElementById('revPhotoFile').value = '';
        document.getElementById('uploadBtnText').innerText = i18n[currentLang].rev_choose_file;
        uploadedPhotoUrl = "";
        setFormRating(5);

    } catch (error) {
        console.error('Review publish error:', error);
        alert('Не вдалося опублікувати відгук. Перевірте налаштування Firebase.');
    } finally {
        btn.disabled = false;
        btn.style.opacity = "1";
        btnText.innerText = i18n[currentLang].pub_review;
    }
}

async function deleteOwnReview(id) {
    const review = firebaseReviews.find(r => r.id === id);
    if (!review || !currentReviewUser || review.ownerUid !== currentReviewUser.uid) return;
    try {
        await firestoreDb.collection('reviews').doc(id).delete();
    } catch (error) {
        console.error('Review delete error:', error);
        alert('Не вдалося видалити відгук.');
    }
}

function escapeReviewHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[char]);
}

function parseCSV(text) {
    let rows = [], row = [], col = '', q = false;
    for (let i = 0; i < text.length; i++) {
        let c = text[i], n = text[i+1];
        if (c === '"' && q && n === '"') { col += '"'; i++; }
        else if (c === '"') q = !q;
        else if (c === ',' && !q) { row.push(col.trim()); col = ''; }
        else if ((c === '\r' || c === '\n') && !q) {
            if (col || row.length) { row.push(col.trim()); rows.push(row); }
            row = []; col = ''; if (c === '\r' && n === '\n') i++;
        } else col += c;
    }
    if (col || row.length) { row.push(col.trim()); rows.push(row); }
    const h = rows[0];
    return rows.slice(1).map(r => {
        let o = {}; h.forEach((k, i) => o[k] = r[i] || "");
        return o;
    });
}

    let badgesHtml = '<div class="badges-wrapper">';
    const isNew = p.isNew?.toLowerCase() === 'yes' || p.isNew === true;
    const isHit = p.isBest?.toLowerCase() === 'yes' || p.isBest === true;
    const isSale = isSaleProduct(p);

function switchCardSize(event, pIdx, sizeLabel, price, oldPrice) {
    event.stopPropagation();
    const container = document.getElementById(`price-block-${pIdx}`);
    if (!container) return;

    if (oldPrice && oldPrice !== '---' && oldPrice !== '') {
        container.innerHTML = `<span class="price-new">${price} zł</span><span class="price-old">${oldPrice} zł</span> <span class="text-[9px] text-neutral-400 font-normal">(${sizeLabel})</span>`;
    } else {
        container.innerHTML = `<span>${price} zł</span> <span class="text-[9px] text-neutral-400 font-normal">(${sizeLabel})</span>`;
    }

    const card = container.closest('.product-card');
    if (card) {
        card.querySelectorAll('.size-pill').forEach(btn => btn.classList.remove('active'));
        const activeBtn = event.currentTarget;
        if (activeBtn) activeBtn.classList.add('active');
        card.setAttribute('data-selected-size', sizeLabel);
    }
}

function renderList(list) {
    return list.map((p) => {
        const pIdx = allProducts.indexOf(p);
        const avail = isAvailable(p);
        const isSet = p.category?.toLowerCase().trim() === 'sets';
        const photo = p.photo.split(',')[0].trim();
        
        const sizes = [
            { label: '2ml', price: p.price2ml, old: p.old2ml },
            { label: '5ml', price: p.price5ml, old: p.old5ml },
            { label: '10ml', price: p.price10ml, old: p.old10ml },
            { label: 'Full', price: p.fullPrice, old: p.oldFull }
        ].filter(s => s.price && s.price !== '---' && s.price !== '');

        const initialSize = sizes[0] || { label: '', price: '0', old: '' };

        let selectorHtml = '';
        if (sizes.length > 1 && !isSet) {
            selectorHtml = `<div class="flex flex-wrap gap-1 mb-3">`;
            sizes.forEach((s, idx) => {
                const isActive = idx === 0 ? 'active' : '';
                selectorHtml += `
                    <button onclick="switchCardSize(event, ${pIdx}, '${s.label}', '${s.price}', '${s.old || ''}')" 
                            class="size-pill ${isActive}">
                        ${s.label}
                    </button>`;
            });
            selectorHtml += `</div>`;
        }

        let priceHtml = '';
        if (initialSize.old && initialSize.old !== '---' && initialSize.old !== '') {
            priceHtml = `<span class="price-new">${initialSize.price} zł</span><span class="price-old">${initialSize.old} zł</span>`;
        } else {
            priceHtml = `<span>${initialSize.price} zł</span>`;
        }
        if (!isSet && initialSize.label) {
            priceHtml += ` <span class="text-[9px] text-neutral-400 font-normal">(${initialSize.label})</span>`;
        }

        return `
        <div onclick="openModal(${pIdx})" id="prod-card-${pIdx}" data-selected-size="${initialSize.label}" class="product-card p-4 flex flex-col h-full ${!avail ? 'out-of-stock' : ''} ${isSet ? 'is-set-card' : ''}">
            <div class="img-container mb-4">${getBadgesHTML(p)}<img src="${photo}" loading="lazy"></div>
            <div class="text-[7px] font-black text-[#C5A059] uppercase tracking-widest mb-1">${p.brand}</div>
            <div class="product-title">${currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name)}</div>
            
            ${selectorHtml}
            
            <div class="mt-auto text-xs font-black text-[#062C22]" id="price-block-${pIdx}">
                ${priceHtml}
            </div>
        </div>`;
    }).join('');
}

            html += `<div id="m-size-row-${o.l}" onclick="${avail ? `selectSize(this, '${o.l}', '${o.p}', '${p.brand}', '${currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name)}', '${p.photo.split(',')[0].trim()}')` : ''}" 
                class="border border-neutral-100 flex justify-between items-center p-4 rounded-xl ${avail ? 'cursor-pointer hover:bg-neutral-50' : 'opacity-40 cursor-not-allowed'} text-xs font-bold transition-all">
                <span class="uppercase tracking-widest">${o.l}</span>
                <span class="text-[#062C22]">${hasDiscount ? `<span class="price-new">${o.p} zł</span><span class="price-old">${o.old} zł</span>` : `<span>${o.p} zł</span>`}</span>
            </div>`;
        }
    });
    
    document.getElementById('m-prices').innerHTML = html;
    document.getElementById('pModal').classList.remove('hidden');
    document.body.classList.add('lock-scroll');

    if (avail) {
        const targetLabel = preselectedSize || sizes.find(s => s.p && s.p !== '---' && s.p !== '')?.l;
        if (targetLabel) {
            const rowEl = document.getElementById(`m-size-row-${targetLabel}`);
            if (rowEl) rowEl.click();
        }
    }
}

function closeModal() { 
    document.getElementById('pModal').classList.add('hidden'); 
    document.body.classList.remove('lock-scroll');
    if(swiperInstance) { swiperInstance.destroy(true, true); swiperInstance = null; }
}

function selectSize(el, size, price, brand, name, img) {
    document.querySelectorAll('#m-prices div').forEach(d => { d.style.borderColor = '#F0F0F0'; d.style.background = 'white'; });
    el.style.borderColor = '#C5A059'; el.style.background = '#fdfaf3';
    selectedOption = { size, price, brand, name, img, id: Date.now() };
    const btn = document.getElementById('add-to-cart-btn');
    btn.classList.remove('opacity-20', 'cursor-not-allowed');
    btn.innerText = `${i18n[currentLang].add_to_cart} • ${price} zł`;
}

function addToCart() {
    if(!selectedOption) return;
    cart.push(selectedOption);
    localStorage.setItem('ps_cart', JSON.stringify(cart));
    renderCart(); closeModal(); toggleCart(true);
}

function renderCart() {
    const c = document.getElementById('cart-items');
    const countEl = document.getElementById('cart-count');
    countEl.innerText = cart.length;
    countEl.classList.toggle('hidden', cart.length === 0);
    let total = 0;
    if (cart.length === 0) {
        c.innerHTML = `<div class="text-center py-10 text-neutral-300 text-[9px] uppercase font-bold">${i18n[currentLang].empty_cart}</div>`;
    } else {
        c.innerHTML = cart.map((item, i) => {
            total += parseFloat(item.price);
            return `<div class="flex gap-4 items-center">
                <div class="w-14 h-14 bg-neutral-50 rounded-xl p-2 flex items-center justify-center"><img src="${item.img}" class="max-w-full max-h-full object-contain"></div>
                <div class="flex-1 min-w-0">
                    <div class="text-[7px] font-black text-[#C5A059] uppercase">${item.brand}</div>
                    <div class="text-[10px] font-bold truncate">${item.name}</div>
                    <div class="text-[9px] text-neutral-400 font-bold">${item.size} • ${item.price} zł</div>
                </div>
                <button onclick="removeFromCart(${i})" class="text-neutral-200 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        }).join('');
    }
    document.getElementById('cart-total').innerText = total.toFixed(2) + ' zł';
}

function removeFromCart(i) { cart.splice(i, 1); localStorage.setItem('ps_cart', JSON.stringify(cart)); renderCart(); }

function sendOrder() {
    if (cart.length === 0) return;
    let t = `${i18n[currentLang].order_msg}!\n\n`;
    cart.forEach((it, i) => t += `${i+1}. ${it.brand} ${it.name} (${it.size}) - ${it.price} zł\n`);
    t += `\n💰 ${i18n[currentLang].cart_total_label}: ${document.getElementById('cart-total').innerText}`;
    window.open(`https://t.me/${TG_NICK}?text=${encodeURIComponent(t)}`, '_blank');
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); document.body.classList.toggle('lock-scroll'); }
function toggleCart(st) { const p = document.getElementById('cart-panel'); if (st === true) p.classList.remove('translate-x-full'); else p.classList.toggle('translate-x-full'); }

function saveState() {
    localStorage.setItem('ps_currentFilter', currentFilter);
    localStorage.setItem('ps_curCat', curCat);
}

function goHome() { currentFilter = 'home'; curCat = 'all'; saveState(); refreshCatalog(); }
function showAllCatalog() { currentFilter = 'all'; curCat = 'all'; saveState(); updateCatButtons(); refreshCatalog(); }
function setCategory(c) { curCat = c; saveState(); updateCatButtons(); refreshCatalog(); }
function updateCatButtons() { document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.id === 'cat-' + curCat)); }
function filterBy(type) { currentFilter = type; saveState(); window.scrollTo({top: 0, behavior: 'smooth'}); refreshCatalog(); }

document.getElementById('add-to-cart-btn').onclick = addToCart;
init();
</script>
</body>
</html>
