async function init() {
    updateUI();
    initFirebaseReviews();
    try {
        const res = await fetch(SPREADSHEET_URL);
        const text = await res.text();
        allProducts = parseCSV(text);
        allProducts.sort((a, b) => {
            if (a.brand === "BANNER") return -1;
            if (b.brand === "BANNER") return 1;
            return (a.brand.localeCompare(b.brand)) || ((currentLang === 'UA' ? (a.nameUK || a.name) : (a.namePL || a.name)).localeCompare(currentLang === 'UA' ? (b.nameUK || b.name) : (b.namePL || b.name)));
        });
        updateUI(); updateCatButtons(); refreshCatalog(); renderCart(); loadGoogleReviews();
        setTimeout(() => { AOS.init({ duration: 800, once: true, offset: 50 }); }, 200);
    } catch (e) { console.error("CSV Load Error", e); }
}

async function initFirebaseReviews() {
    try {
        const credential = await firebaseAuth.signInAnonymously();
        currentReviewUser = credential.user;

        if (stopReviewsListener) stopReviewsListener();
        stopReviewsListener = firestoreDb.collection('reviews')
            .orderBy('createdAt', 'desc')
            .onSnapshot(snapshot => {
                firebaseReviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                loadGoogleReviews();
            }, error => {
                console.error('Reviews listener error:', error);
                showReviewsError();
            });
    } catch (error) {
        console.error('Firebase authentication error:', error);
        showReviewsError();
    }
}

function showReviewsError() {
    const list = document.getElementById('reviews-list');
    if (list) {
        list.innerHTML = '<div class="text-center py-6 text-red-400 text-[10px] uppercase font-bold tracking-widest">Firebase: перевірте Authentication і правила Firestore</div>';
    }
}

function setFormRating(rating) {

async function handleFileSelect(input) {
    const files = Array.from(input.files).filter(file => file.type.startsWith('image/')).slice(0, 5);
    if (!files.length) return;

    const btnText = document.getElementById('uploadBtnText');
    btnText.innerText = "...";

    try {
        uploadedPhotoUrls = [];
        for (const file of files) {
            uploadedPhotoUrls.push(await compressReviewImage(file));
        }
        btnText.innerText = currentLang === 'PL'
            ? `✓ ${uploadedPhotoUrls.length} zdjęć`
            : `✓ ${uploadedPhotoUrls.length} фото`;
    } catch (error) {
        console.error('Image compression error:', error);
        uploadedPhotoUrls = [];
        btnText.innerText = i18n[currentLang].rev_choose_file;
        input.value = "";
    }
}

function compressReviewImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let maxSide = 700;
                let quality = 0.68;
                let result = '';

                for (let attempt = 0; attempt < 6; attempt++) {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    result = canvas.toDataURL('image/jpeg', quality);
                    if (result.length <= 140000) break;
                    maxSide = Math.round(maxSide * 0.85);
                    quality = Math.max(0.42, quality - 0.07);
                }
                resolve(result);
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

async function handleReviewSubmit(e) {
    e.preventDefault();
    const nameVal = document.getElementById('revName').value.trim();
    const textVal = document.getElementById('revText').value.trim();
    const btn = document.getElementById('submitReviewBtn');
    const btnText = document.getElementById('btn-text-content');
    
    if(!nameVal || !currentReviewUser) {
        if (!currentReviewUser) showReviewsError();
        return;
    }

    btn.disabled = true;
    btn.style.opacity = "0.6";
    btnText.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> ' + i18n[currentLang].pub_loading;

    try {
        await firestoreDb.collection('reviews').add({
            name: nameVal,
            text: textVal,
            rating: userRating,
            photos: uploadedPhotoUrls,
            ownerUid: currentReviewUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('revName').value = '';
        document.getElementById('revText').value = '';
        document.getElementById('revPhotoFile').value = '';
        document.getElementById('uploadBtnText').innerText = i18n[currentLang].rev_choose_file;
        uploadedPhotoUrls = [];
        setFormRating(5);

    } catch (error) {
        console.error('Review publish error:', error);
        alert('Не вдалося опублікувати відгук. Перевірте налаштування Firebase.');
    } finally {
        btn.disabled = false;
        btn.style.opacity = "1";
        btnText.innerText = i18n[currentLang].pub_review;
    }
}

async function deleteOwnReview(id) {
    if (!currentReviewUser) return;
    try {
        await firestoreDb.collection('reviews').doc(id).delete();
    } catch (error) {
        console.error('Review delete error:', error);
    }
}

function loadGoogleReviews() {
    const list = document.getElementById('reviews-list');
    const previewList = document.getElementById('reviews-preview-list');
    const previewRating = document.getElementById('preview-rating');
    const avgNum = document.getElementById('average-rating-num');
    const avgStars = document.getElementById('average-stars');

    const totalReviews = firebaseReviews;
    const count = totalReviews.length;

    let sum = totalReviews.reduce((acc, r) => acc + (Number(r.rating) || 5), 0);
    const avg = count > 0 ? (sum / count).toFixed(1) : "5.0";

    if (previewRating) previewRating.innerText = `${avg} / 5 (${count})`;
    if (avgNum) avgNum.innerText = `${avg} / 5`;

    if (avgStars) {
        let starsHtml = '';
        const fullStars = Math.round(Number(avg));
        for (let i = 1; i <= 5; i++) {
            starsHtml += `<i class="fa-solid fa-star ${i <= fullStars ? 'text-[#C5A059]' : 'text-neutral-200'}"></i>`;
        }
        avgStars.innerHTML = starsHtml;
    }

    if (count === 0) {
        const emptyText = i18n[currentLang].no_reviews;
        if (list) list.innerHTML = `<div class="text-center py-6 text-neutral-400 text-xs">${emptyText}</div>`;
        if (previewList) previewList.innerHTML = `<div class="col-span-2 text-center py-4 text-neutral-400 text-xs">${emptyText}</div>`;
        return;
    }

    let html = '';
    totalReviews.forEach(r => {
        const rName = escapeHtml(r.name || 'Klient');
        const rText = escapeHtml(r.text || '');
        const rRating = Number(r.rating) || 5;
        const dateStr = r.createdAt ? new Date(r.createdAt.toDate()).toLocaleDateString() : '';
        const isOwner = currentReviewUser && r.ownerUid === currentReviewUser.uid;

        let stars = '';
        for (let i = 1; i <= 5; i++) {
            stars += `<i class="fa-solid fa-star text-[10px] ${i <= rRating ? 'text-[#C5A059]' : 'text-neutral-200'}"></i>`;
        }

        let photosHtml = '';
        if (r.photos && r.photos.length) {
            photosHtml = '<div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar">';
            r.photos.forEach(p => {
                photosHtml += `<img src="${p}" onclick="openPhotoModal('${p}')" class="w-14 h-14 object-cover rounded-xl cursor-pointer hover:opacity-90 border border-neutral-100 shrink-0">`;
            });
            photosHtml += '</div>';
        }

        html += `
            <div class="bg-white p-5 rounded-3xl border border-neutral-100 shadow-sm relative">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <div class="font-bold text-xs mb-0.5">${rName}</div>
                        <div class="flex gap-0.5">${stars}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] text-neutral-400">${dateStr}</span>
                        ${isOwner ? `<button onclick="deleteOwnReview('${r.id}')" class="text-neutral-300 hover:text-red-500 text-xs px-1.5 py-0.5" title="${i18n[currentLang].delete_btn}"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div>
                </div>
                ${rText ? `<p class="text-xs text-neutral-600 leading-relaxed mt-2">${rText}</p>` : ''}
                ${photosHtml}
            </div>
        `;
    });
    if (list) list.innerHTML = html;

    if (previewList) {
        let previewHtml = '';
        const previewItems = totalReviews.slice(0, 2);
        previewItems.forEach(r => {
            const rName = escapeHtml(r.name || 'Klient');
            const rText = escapeHtml(r.text || '');
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<i class="fa-solid fa-star text-[8px] ${i <= Number(r.rating) ? 'text-[#C5A059]' : 'text-neutral-200'}"></i>`;
            }
            previewHtml += `
                <div class="bg-neutral-50 p-3 rounded-2xl border border-neutral-100 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-[10px] truncate max-w-[100px]">${rName}</span>
                            <div class="flex gap-0.5">${stars}</div>
                        </div>
                        ${rText ? `<p class="text-[10px] text-neutral-500 review-preview-text leading-tight">${rText}</p>` : '<p class="text-[10px] text-neutral-400 italic">Brak tekstu</p>'}
                    </div>
                </div>
            `;
        });
        previewList.innerHTML = previewHtml;
    }
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function parseCSV(text) {
    const lines = text.split('\n');
    const result = [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let row = [];
        let inQuotes = false;
        let currentField = '';
        
        for (let char of lines[i]) {
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                row.push(currentField.trim().replace(/^["']|["']$/g, ''));
                currentField = '';
            } else {
                currentField += char;
            }
        }
        row.push(currentField.trim().replace(/^["']|["']$/g, ''));
        
        if (row.length >= headers.length) {
            let item = {};
            headers.forEach((h, index) => { item[h] = row[index] || ''; });
            
            // Исправление путей картинок прямо здесь на лету для максимальной надежности
            if (item.image && !item.image.startsWith('http') && !item.image.startsWith('images/')) {
                if (item.category === 'sets') {
                    item.image = `images/sets/old-money/${item.image}`;
                } else {
                    item.image = `images/products/${item.image}`;
                }
            }
            
            result.push(item);
        }
    }
    return result;
}

            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">`;
        
        let visibleNews = showAllNews ? news : news.slice(0, ITEMS_TO_SHOW_HOME);
        visibleNews.forEach(p => { html += renderProductCard(p); });
        
        html += `</div>`;
        if (news.length > ITEMS_TO_SHOW_HOME) {
            html += `
                <div class="text-center mt-6">
                    <button onclick="toggleShowMore('news')" class="px-8 py-3 bg-neutral-100 hover:bg-neutral-200 text-[#062C22] rounded-2xl text-[10px] font-extrabold uppercase tracking-widest transition-all">
                        ${showAllNews ? i18n[currentLang].show_less : i18n[currentLang].show_more} (${news.length})
                    </button>
                </div>
            `;
        }
        html += `</div>`;
    }

    // НАБОРЫ
    if (sets.length > 0) {
        html += `<div class="mb-12" data-aos="fade-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xs font-extrabold uppercase tracking-[0.2em] opacity-40">${i18n[currentLang].sets_title}</h2>
                <button onclick="filterBy('sets')" class="text-[10px] font-extrabold text-[#C5A059] uppercase tracking-wider">${i18n[currentLang].all_reviews || 'Wszystkie'}</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
        
        let visibleSets = showAllSets ? sets : sets.slice(0, 2);
        visibleSets.forEach(p => { html += renderProductCard(p); });
        
        html += `</div>`;
        if (sets.length > 2) {
            html += `
                <div class="text-center mt-6">
                    <button onclick="toggleShowMore('sets')" class="px-8 py-3 bg-neutral-100 hover:bg-neutral-200 text-[#062C22] rounded-2xl text-[10px] font-extrabold uppercase tracking-widest transition-all">
                        ${showAllSets ? i18n[currentLang].show_less : i18n[currentLang].show_more} (${sets.length})
                    </button>
                </div>
            `;
        }
        html += `</div>`;
    }

    area.innerHTML = html;
    initSwipers();
}

function renderGrid(area, search) {
    let list = allProducts.filter(p => p.brand !== 'BANNER');

    if (search) {
        list = list.filter(p => {
            const name = (currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name)).toLowerCase();
            const brand = (p.brand || '').toLowerCase();
            const desc = (currentLang === 'UA' ? (p.descUK || p.desc) : (p.descPL || p.desc)).toLowerCase();
            return name.includes(search) || brand.includes(search) || desc.includes(search);
        });
    } else if (currentFilter === 'hit') {
        list = list.filter(p => p.hit === 'TRUE');
    } else if (currentFilter === 'new') {
        list = list.filter(p => p.new === 'TRUE');
    } else if (currentFilter === 'sale') {
        list = list.filter(p => p.sale === 'TRUE');
    }

    if (curCat !== 'all' && currentFilter === 'catalog') {
        list = list.filter(p => p.category === curCat);
    }

    if (list.length === 0) {
        area.innerHTML = `<div class="text-center py-20 text-neutral-400 text-sm font-semibold">${currentLang === 'UA' ? 'Нічого не знайдено' : 'Nic nie znaleziono'}</div>`;
        return;
    }

    let titleKey = 'catalog_title';
    if (currentFilter === 'hit') titleKey = 'hits_title';
    if (currentFilter === 'new') titleKey = 'news_title';
    if (currentFilter === 'sets' || curCat === 'sets') titleKey = 'sets_title';

    let html = `
        <div class="mb-6"><h2 class="text-xs font-extrabold uppercase tracking-[0.2em] opacity-40">${i18n[currentLang][titleKey] || 'Katalog'}</h2></div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    `;

    list.forEach(p => { html += renderProductCard(p); });
    html += `</div>`;
    area.innerHTML = html;
    initSwipers();
}

function renderProductCard(p) {
    const isSet = p.category === 'sets';
    const name = currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name);
    const brand = p.brand || '';
    const isOut = p.stock === 'FALSE';

    let badges = '';
    if (p.new === 'TRUE') badges += `<span class="product-badge badge-new">${i18n[currentLang].badgeNew}</span>`;
    if (p.hit === 'TRUE') badges += `<span class="product-badge badge-hit">${i18n[currentLang].badgeHit}</span>`;
    if (p.sale === 'TRUE') badges += `<span class="product-badge badge-sale">${i18n[currentLang].badgeSale}</span>`;

    let priceHtml = '';
    if (isSet) {
        let priceNum = p.price2ml || p.price5ml || p.price10ml || p.price15ml || p.price || '0';
        priceHtml = `<div class="text-sm font-black">${priceNum} zł</div>`;
    } else {
        let minPrice = Infinity;
        [p.price2ml, p.price5ml, p.price10ml, p.price15ml].forEach(pr => {
            if (pr && Number(pr) > 0 && Number(pr) < minPrice) minPrice = Number(pr);
        });
        if (minPrice === Infinity) minPrice = p.price || 0;
        priceHtml = `<div class="text-xs font-black">od ${minPrice} zł</div>`;
    }

    let mediaHtml = '';
    if (isSet) {
        let imgs = [];
        try { if (p.images) imgs = JSON.parse(p.images); } catch(e){}
        if (!imgs.length && p.image) imgs = p.image.split(',').map(s => s.trim());
        
        if (imgs.length > 1) {
            let slides = imgs.map(img => `<div class="swiper-slide"><img src="${img}" alt="${name}"></div>`).join('');
            mediaHtml = `
                <div class="swiper swiper-sets">
                    <div class="swiper-wrapper">${slides}</div>
                    <div class="swiper-pagination"></div>
                </div>
            `;
        } else {
            mediaHtml = `<div class="swiper-sets flex items-center justify-center"><img src="${imgs[0] || p.image || ''}" alt="${name}" class="object-contain max-h-[300px]"></div>`;
        }
    } else {
        mediaHtml = `
            <div class="img-container">
                ${badges ? `<div class="badges-wrapper">${badges}</div>` : ''}
                <img src="${p.image || ''}" alt="${name}">
                ${isOut ? `<span class="product-badge badge-out">${i18n[currentLang].sold_badge}</span>` : ''}
            </div>
        `;
    }

    return `
        <div onclick="openModal('${p.code}')" class="product-card ${isSet ? 'is-set-card col-span-2' : ''} ${isOut ? 'out-of-stock' : ''} p-4 flex flex-col justify-between" data-aos="fade-up">
            ${mediaHtml}
            <div class="mt-3 flex flex-col flex-1 justify-between">
                <div>
                    ${!isSet && brand ? `<div class="text-[9px] font-extrabold uppercase tracking-widest opacity-40 mb-1">${brand}</div>` : ''}
                    <div class="product-title">${name}</div>
                </div>
                <div class="flex items-center justify-between mt-2 pt-2 border-t border-neutral-100">
                    ${priceHtml}
                    <div class="w-8 h-8 rounded-full bg-[#062C22] text-white flex items-center justify-center text-xs shadow-sm">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function initSwipers() {
    if (typeof Swiper !== 'undefined') {
        document.querySelectorAll('.swiper-sets').forEach(el => {
            if (!el.swiper) {
                new Swiper(el, {
                    loop: true,
                    pagination: { el: '.swiper-pagination', clickable: true },
                    autoplay: { delay: 3500, disableOnInteraction: false }
                });
            }
        });
    }
}

function openModal(code) {
    const p = allProducts.find(item => item.code === code);
    if (!p) return;

    const isSet = p.category === 'sets';
    const name = currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name);
    const desc = currentLang === 'UA' ? (p.descUK || p.desc || i18n[currentLang].default_desc) : (p.descPL || p.desc || i18n[currentLang].default_desc);
    const brand = p.brand || '';

    document.getElementById('m-title').innerText = name;
    document.getElementById('m-desc').innerText = desc;

    const brandWrapper = document.getElementById('m-brand-wrapper');
    if (!isSet && brand) {
        brandWrapper.innerHTML = `<span class="text-[9px] font-extrabold uppercase tracking-widest bg-neutral-100 px-3 py-1 rounded-lg text-neutral-500">${brand}</span>`;
    } else {
        brandWrapper.innerHTML = '';
    }

    const mediaSlot = document.getElementById('modal-media-slot');
    if (isSet) {
        let imgs = [];
        try { if (p.images) imgs = JSON.parse(p.images); } catch(e){}
        if (!imgs.length && p.image) imgs = p.image.split(',').map(s => s.trim());
        
        if (imgs.length > 1) {
            let slides = imgs.map(img => `<div class="swiper-slide"><img src="${img}" class="w-full h-72 object-contain"></div>`).join('');
            mediaSlot.innerHTML = `
                <div class="swiper swiper-sets bg-neutral-50 rounded-t-[32px] pt-4">
                    <div class="swiper-wrapper">${slides}</div>
                    <div class="swiper-pagination"></div>
                </div>
            `;
            setTimeout(() => {
                new Swiper(mediaSlot.querySelector('.swiper'), {
                    loop: true,
                    pagination: { el: '.swiper-pagination', clickable: true }
                });
            }, 100);
        } else {
            mediaSlot.innerHTML = `<div class="bg-neutral-50 p-6 flex justify-center items-center rounded-t-[32px]"><img src="${imgs[0] || p.image}" class="h-64 object-contain"></div>`;
        }
    } else {
        mediaSlot.innerHTML = `<div class="bg-neutral-50 p-6 flex justify-center items-center rounded-t-[32px]"><img src="${p.image}" class="h-60 object-contain mix-blend-multiply"></div>`;
    }

    const pricesSlot = document.getElementById('m-prices');
    let pricesHtml = '';
    let options = [];

    if (isSet) {
        let pr = Number(p.price2ml || p.price5ml || p.price10ml || p.price15ml || p.price || 0);
        options = [{ size: 'Set', price: pr, oldPrice: Number(p.oldPrice || 0) }];
    } else {
        if (Number(p.price2ml) > 0) options.push({ size: '2 ml', price: Number(p.price2ml), oldPrice: Number(p.oldPrice2ml || 0) });
        if (Number(p.price5ml) > 0) options.push({ size: '5 ml', price: Number(p.price5ml), oldPrice: Number(p.oldPrice5ml || 0) });
        if (Number(p.price10ml) > 0) options.push({ size: '10 ml', price: Number(p.price10ml), oldPrice: Number(p.oldPrice10ml || 0) });
        if (Number(p.price15ml) > 0) options.push({ size: '15 ml', price: Number(p.price15ml), oldPrice: Number(p.oldPrice15ml || 0) });
    }

    selectedOption = null;
    options.forEach((opt, idx) => {
        let isSelected = idx === 0;
        if (isSelected) selectedOption = opt;

        let priceContent = `<span class="font-bold">${opt.price} zł</span>`;
        if (opt.oldPrice > opt.price) {
            priceContent = `<span class="price-new">${opt.price} zł</span><span class="price-old">${opt.oldPrice} zł</span>`;
        }

        pricesHtml += `
            <div onclick='selectSizeOption(${JSON.stringify(opt)}, this)' class="size-option-card flex items-center justify-between p-4 rounded-2xl border ${isSelected ? 'border-[#062C22] bg-[#062C22]/5' : 'border-neutral-100 bg-neutral-50'} cursor-pointer transition-all">
                <span class="text-xs font-bold uppercase tracking-wider">${opt.size}</span>
                <div class="text-sm">${priceContent}</div>
            </div>
        `;
    });

    pricesSlot.innerHTML = pricesHtml;

    const cartBtn = document.getElementById('add-to-cart-btn');
    if (p.stock === 'FALSE') {
        cartBtn.innerText = i18n[currentLang].out_of_stock_btn;
        cartBtn.disabled = true;
        cartBtn.style.opacity = "0.4";
        cartBtn.style.cursor = "not-allowed";
    } else {
        cartBtn.innerText = i18n[currentLang].add_to_cart;
        cartBtn.disabled = false;
        cartBtn.style.opacity = "1";
        cartBtn.style.cursor = "pointer";
        cartBtn.onclick = () => {
            addToCart(p, selectedOption);
            closeModal();
        };
    }

    document.getElementById('pModal').classList.remove('hidden');
    document.body.classList.add('lock-scroll');
}

function selectSizeOption(opt, element) {
    selectedOption = opt;
    document.querySelectorAll('.size-option-card').forEach(el => {
        el.classList.remove('border-[#062C22]', 'bg-[#062C22]/5');
        el.classList.add('border-neutral-100', 'bg-neutral-50');
    });
    element.classList.remove('border-neutral-100', 'bg-neutral-50');
    element.classList.add('border-[#062C22]', 'bg-[#062C22]/5');
}

function closeModal() {
    document.getElementById('pModal').classList.add('hidden');
    document.body.classList.remove('lock-scroll');
}

function addToCart(p, opt) {
    if (!opt) return;
    const name = currentLang === 'UA' ? (p.nameUK || p.name) : (p.namePL || p.name);
    const existingIndex = cart.findIndex(item => item.code === p.code && item.size === opt.size);

    if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
    } else {
        cart.push({
            code: p.code,
            name: name,
            brand: p.brand || '',
            size: opt.size,
            price: opt.price,
            image: p.image,
            qty: 1
        });
    }

    saveCart();
    toggleCart();
}

function saveCart() {
    localStorage.setItem('ps_cart', JSON.stringify(cart));
    renderCart();
}

function renderCart() {
    const container = document.getElementById('cart-items');
    const countEl = document.getElementById('cart-count');
    const totalEl = document.getElementById('cart-total');

    let totalCount = cart.reduce((acc, i) => acc + i.qty, 0);
    let totalPrice = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

    if (totalCount > 0) {
        countEl.innerText = totalCount;
        countEl.classList.remove('hidden');
    } else {
        countEl.classList.add('hidden');
    }

    totalEl.innerText = `${totalPrice} zł`;

    if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-20 text-neutral-400 text-xs font-bold uppercase tracking-widest">${i18n[currentLang].empty_cart}</div>`;
        return;
    }

    let html = '';
    cart.forEach((item, idx) => {
        html += `
            <div class="flex items-center gap-4 bg-neutral-50 p-4 rounded-2xl border border-neutral-100">
                <img src="${item.image}" class="w-14 h-14 object-contain bg-white rounded-xl p-1 shrink-0">
                <div class="flex-1 min-w-0">
                    ${item.brand && item.brand !== 'BANNER' ? `<div class="text-[8px] font-extrabold uppercase tracking-widest opacity-40">${item.brand}</div>` : ''}
                    <div class="font-bold text-xs truncate">${item.name}</div>
                    <div class="text-[10px] text-neutral-400 font-semibold">${item.size} • ${item.price} zł</div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="changeQty(${idx}, -1)" class="w-6 h-6 rounded-lg bg-white border border-neutral-200 flex items-center justify-center text-xs font-bold">-</button>
                    <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                    <button onclick="changeQty(${idx}, 1)" class="w-6 h-6 rounded-lg bg-white border border-neutral-200 flex items-center justify-center text-xs font-bold">+</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function changeQty(idx, delta) {
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) {
        cart.splice(idx, 1);
    }
    saveCart();
}

function toggleCart() {
    const panel = document.getElementById('cart-panel');
    panel.classList.toggle('translate-x-full');
    document.body.classList.toggle('lock-scroll');
}

function sendOrder() {
    if (cart.length === 0) return;
    let text = `${i18n[currentLang].order_msg}:\n`;
    let total = 0;
    cart.forEach(i => {
        text += `- ${i.brand ? i.brand + ' ' : ''}${i.name} (${i.size}) x ${i.qty} = ${i.price * i.qty} zł\n`;
        total += i.price * i.qty;
    });
    text += `\nРазом / Suma: ${total} zł`;
    window.open(`https://t.me/${TG_NICK}?text=${encodeURIComponent(text)}`, '_blank');
}

function sendInstagramOrder() {
    if (cart.length === 0) return;
    let text = `${i18n[currentLang].order_msg}:\n`;
    let total = 0;
    cart.forEach(i => {
        text += `- ${i.brand ? i.brand + ' ' : ''}${i.name} (${i.size}) x ${i.qty} = ${i.price * i.qty} zł\n`;
        total += i.price * i.qty;
    });
    text += `\nРазом / Suma: ${total} zł`;
    
    navigator.clipboard.writeText(text).then(() => {
        alert(i18n[currentLang].instagram_copied);
        window.open(`https://www.instagram.com/${INSTAGRAM_NICK}/`, '_blank');
    }).catch(() => {
        window.open(`https://www.instagram.com/${INSTAGRAM_NICK}/`, '_blank');
    });
}

window.onload = init;
</script>
</body>
</html>
